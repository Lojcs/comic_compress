name: comic_compress
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.1
  flutter: 3.47.5

dependencies:
  flutter:
    sdk: flutter

  copy_with_extension: ^18.0.0
  equatable: ^3.0.0

  cupertino_icons: ^2.0.0
  flutter_bloc: ^9.1.1
  super_drag_and_drop: ^0.9.1
  file_picker: ^11.0.3
  window_manager: ^0.5.2
  path: ^1.9.1
  collection: ^1.19.1
  unrar: ^0.1.2
  archive: ^4.3.0
  url_launcher: ^6.3.3
  dynamic_color: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.0
  copy_with_extension_gen: ^18.0.0
  flutter_lints: ^6.0.0

